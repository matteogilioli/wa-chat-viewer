    }

    schedule() {
      if (this._raf) return;
      this._raf = requestAnimationFrame(() => { this._raf = 0; this.update(); });
    }

    /** Paint the visible window and realign positions once rows are measured. */
    update() {
      if (!this.count) { this.applyHeight(); return; }
      const s = this.scroller;
      // safety margin: fixed on both sides, widened ahead of us in proportion
      // to the speed (up to a little more than two screenfuls).
      const lead = Math.min(Math.abs(this.velocity) * 320, 2600);
      const up = this.overscan + (this.velocity < 0 ? lead : 0);
      const down = this.overscan + (this.velocity > 0 ? lead : 0);
      const top = Math.max(0, s.scrollTop - up);
      const bottom = s.scrollTop + s.clientHeight + down;

      let first = this.fen.search(top);
      let last = this.fen.search(Math.min(bottom, Math.max(0, this.fen.total() - 1)));
      last = Math.min(this.count - 1, last + 1);

      for (const [i, el] of this.rendered) {
        if (i < first || i > last) { el.remove(); this.rendered.delete(i); }
      }
      const frag = document.createDocumentFragment();
      for (let i = first; i <= last; i++) {
        if (this.rendered.has(i)) continue;
        const el = this.renderRow(i);
        el.dataset.i = i;
        el.style.position = 'absolute';
        el.style.top = '0px';
        el.style.transform = 'translateY(' + this.fen.prefix(i) + 'px)';
        this.rendered.set(i, el);
        frag.appendChild(el);
      }
      if (frag.childNodes.length) this.inner.appendChild(frag);

      // Measure: real heights correct the estimates. The new heights are
      // collected first and applied afterwards in index order, so the prefix
      // sums stay consistent while the scroll compensation is computed.
      const anchorTop = s.scrollTop;
      const anchorIdx = this.fen.search(anchorTop);
      const changes = [];
      for (const [i, el] of this.rendered) {
        if (this.measured[i]) continue;                    // already known
        // above the viewport, with a scroll under way: defer it (see _onScroll)
        if (this.userScrolling && i < anchorIdx) continue;
        const h = el.offsetHeight;
        this.measured[i] = 1;
        if (Math.abs(h - this.fen.get(i)) > 0.5) changes.push([i, h]);
      }
      if (changes.length) {
        changes.sort((a, b) => a[0] - b[0]);
        let shift = 0;
        for (const [i, h] of changes) {
          if (i < anchorIdx) shift += h - this.fen.get(i);
          this.fen.set(i, h);
        }
        for (const [i, el] of this.rendered) {
          el.style.transform = 'translateY(' + this.fen.prefix(i) + 'px)';
        }
        this.applyHeight();
        if (this.pinBottom) this.jump(this.fen.total());
        else if (shift) this.jump(anchorTop + shift);
        this.schedule();                       // second pass to settle
      } else {
        this.applyHeight();
        if (this.pinBottom) {
          const target = Math.max(0, this.fen.total() - s.clientHeight);
          if (Math.abs(s.scrollTop - target) > 1) this.jump(target);
        }
      }

      if (this.onRange) this.onRange(first, last);
    }

    offsetOf(i) { return this.fen.prefix(i); }

    /** Bring a message into view; `align` = 'center' | 'start'. */
    scrollToIndex(i, align) {
      i = Math.max(0, Math.min(this.count - 1, i));
      this.pinBottom = false;
      this.userScrolling = false;          // here the corrections are needed at once
      clearTimeout(this._idle);
      const go = (n) => {
        const off = this.fen.prefix(i);
        const target = align === 'start'
          ? off - 8
          : off - Math.max(0, (this.scroller.clientHeight - this.fen.get(i)) / 2);
        this.jump(target);
        this.update();
        if (n > 0) requestAnimationFrame(() => go(n - 1));
      };
      go(3);       // estimates sharpen with every pass: 3 are enough to get there
    }

    scrollToBottom() {
      this.pinBottom = true;
      this.userScrolling = false;
      this.jump(this.fen.total());
      this.update();
    }

    /** Repaint a row already on screen (e.g. after a media file has loaded). */
    invalidate(i) {
      const el = this.rendered.get(i);
      if (!el) return;
      el.remove();
      this.rendered.delete(i);
      this.measured[i] = 0;
      this.schedule();
    }

    destroy() {
      clearTimeout(this._idle);
      this.scroller.removeEventListener('scroll', this._onScroll);
      global.removeEventListener('resize', this._onResize);
      this.clear();
    }
  }

  global.Virtual = { VirtualList, Fenwick };
})(window);
</script>
<script>
/* ==========================================================================
   render.js — building the bubbles.
   Every row of the virtual list is a self-contained element: day separator
   (when the message opens a new date) + the message bubble.
   ========================================================================== */
(function (global) {
  'use strict';

  const { Fmt, Media } = global;
  const t = (k, v) => global.I18n.t(k, v);

  const ICON = {
    checks: '<svg viewBox="0 0 24 24"><path d="M1 13l4 4L14 8"/><path d="M8 13l4 4 9-9"/></svg>',
    play:   '<svg viewBox="0 0 12 14"><path d="M0 0v14l12-7z"/></svg>',
    pause:  '<svg viewBox="0 0 12 14"><path d="M0.5 0h4v14h-4zM7.5 0h4v14h-4z"/></svg>',
    mic:    '<svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
    doc:    '<svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
    dl:     '<svg viewBox="0 0 24 24"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 20h14"/></svg>',
    lock:   '<svg viewBox="0 0 24 24" class="lock"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
    ban:    '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>',
    image:  '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5-5-4 4-2-2-7 7"/></svg>',
    video:  '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10l6-3v10l-6-3z"/></svg>',
    audio:  '<svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
    sticker:'<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 1 8 8c0-4.4 3.6-8 8-8"/></svg>',
    phone:  '<svg viewBox="0 0 24 24"><path d="M6 3h3l2 5-2.5 1.5a11 11 0 0 0 5 5L15 12l5 2v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4 5.2 2 2 0 0 1 6 3z"/></svg>',
    pin:    '<svg viewBox="0 0 24 24"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
    person: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
    poll:   '<svg viewBox="0 0 24 24"><path d="M5 20V9m7 11V4m7 16v-7"/></svg>',
    once:   '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M11 8.5 12.5 8v8M10.5 16h4"/></svg>',
  };

  // Icons are parsed once and then cloned: re-parsing the SVG on every row is
  // one of the biggest costs when scrolling fast.
  const iconCache = new Map();
  function icon(name) {
    let tpl = iconCache.get(name);
    if (!tpl) {
      tpl = document.createElement('template');
      tpl.innerHTML = ICON[name];
      iconCache.set(name, tpl);
    }
    return tpl.content.firstChild.cloneNode(true);
  }

  /**
   * Marks a single row as possibly having changed height (a media file just
   * arrived). Only that row is marked: flagging every visible row would force
   * the browser to re-measure them all on the next frame, and on Safari every
   * height read costs a layout recalculation.
   */
  function heightChanged(el) {
    if (!st.list) return;
    const row = el.closest && el.closest('.row');
    const i = row && row.dataset.i != null ? +row.dataset.i : -1;
    if (i >= 0) st.list.measured[i] = 0;
    st.list.schedule();
  }

  const WAVE_BARS = 34;
  const GROUP_GAP = 5 * 60 * 1000;   // same sender within 5 minutes = one group

  const st = {
    messages: [], me: null, isGroup: false, store: null, list: null,
    highlight: '', flashIndex: -1, colWidth: 0,
  };

  function init(o) {
    Object.assign(st, o);
    st.ratios = st.ratios || new Map();
    measureColumn();
    calibrate();
    buildAlbums();
  }

  /**
   * Measures up front how tall a line of text is and how much the padding,
   * the timestamp and the sender name add. Hard-coded guesses are off by a few
   * pixels per message, and when the real measurement lands the list jumps
   * under you mid-scroll.
   */
  function calibrate() {
    const chat = document.getElementById('chat');
    if (!chat) return;
    const bench = document.createElement('div');
    bench.style.cssText = 'position:absolute;visibility:hidden;top:-9999px;left:0;right:0';
    chat.appendChild(bench);

    const sample = (lines, first, author) => {
      const r = document.createElement('div');
      r.className = 'row';
      r.innerHTML = '<div class="msg in' + (first ? ' first' : '') + '"><div class="bubble">' +
        (author ? '<div class="author">Name</div>' : '') +
        '<div class="text">' + Array.from({ length: lines }, () => 'text').join('<br>') + '</div>' +
        '<div class="meta"><span>00:00</span></div></div></div>';
      bench.appendChild(r);
      const h = r.offsetHeight;
      r.remove();
      return h;
    };

    const h1 = sample(1, false, false);
    const h2 = sample(2, false, false);
    st.metrics = {
      line: Math.max(12, h2 - h1),
      chrome: h1 - (h2 - h1),
      first: sample(1, true, false) - h1,
      author: sample(1, false, true) - h1,
      daysep: 46,
    };
    bench.remove();
  }

  const ALBUM_GAP = 90 * 1000;   // photos sent together: a few seconds apart

  /**
   * WhatsApp shows photos and videos sent together in a single tile. In the
   * export, though, every media file is a message of its own, so here they get
   * put back together: same sender, one after the other, a few seconds apart
   * and with no caption (except the last one, which in WhatsApp carries the
   * caption under the tile).
   */
  function buildAlbums() {
    st.albumFirst = new Map();   // first index -> every index in the album
    st.albumOf = new Map();      // any index -> the album's first index
    const isCell = (m) => m && m.files && m.files.length === 1 &&
      ['image', 'video'].includes(Media.kindOf(m.files[0].base));

    for (let i = 0; i < st.messages.length; i++) {
      if (!isCell(st.messages[i]) || st.messages[i].body) continue;
      const group = [i];
      let j = i + 1;
      while (j < st.messages.length) {
        const a = st.messages[j - 1], b = st.messages[j];
        if (!isCell(b) || b.sender !== a.sender || b.t - a.t > ALBUM_GAP) break;
        group.push(j);
        if (b.body) { j++; break; }        // the caption closes the album
        j++;
      }
      if (group.length >= 2) {
        st.albumFirst.set(i, group);
        for (const k of group) st.albumOf.set(k, i);
        i = group[group.length - 1];
      }
    }
  }

  /** Width of photos and videos in the bubbles: must match the CSS. */
  const photoWidth = () => Math.min(330, global.innerWidth * 0.7);

  /** Usable width of a bubble: only needed to estimate the height of the text. */
  function measureColumn() {
    const w = (document.getElementById('chat') || { clientWidth: 700 }).clientWidth || 700;
    const pad = w <= 640 ? 24 : w * (w >= 1100 ? 0.24 : 0.10);
    st.colWidth = Math.min(560, (w - pad) * 0.78);
  }

  const isFirstOfGroup = (i) => {
    const m = st.messages[i], p = st.messages[i - 1];
    if (!p || m.sys || p.sys) return true;
    if (p.sender !== m.sender) return true;
    return m.t - p.t > GROUP_GAP;
  };

  const opensDay = (i) => i === 0 || Fmt.dayKey(st.messages[i].t) !== Fmt.dayKey(st.messages[i - 1].t);

  const isOut = (m) => !m.sys && m.sender === st.me;

  /* ----------------------------------------------------------- heights */

  function estimate(i) {
    const m = st.messages[i];
    // media that sits inside an album has no row of its own
    if (st.albumOf.has(i) && st.albumOf.get(i) !== i) return 0;

    const M = st.metrics || { line: 19.3, chrome: 34, first: 9, author: 17, daysep: 46 };
    let h = opensDay(i) ? M.daysep : 0;
    if (m.sys) return h + 40;

    const cpl = Math.max(18, st.colWidth / 7.4);
    const textH = (s) => {
      if (!s) return 0;
      let rows = 0;
      for (const line of s.split('\n')) rows += Math.max(1, Math.ceil(line.length / cpl));
      return rows * M.line;
    };

    h += M.chrome;
    if (isFirstOfGroup(i)) h += M.first;
    if (!isOut(m) && st.isGroup && isFirstOfGroup(i)) h += M.author;

    if (st.albumFirst.has(i)) {
      const g = st.albumFirst.get(i);
      const w = Math.min(300, st.colWidth);
      return h + (g.length === 2 ? w * 0.5 : g.length === 3 ? w * 0.67 : w) +
             textH(st.messages[g[g.length - 1]].body);
    }

    if (m.files) {
      for (const f of m.files) h += mediaH(f);
      return h + textH(m.body);
    }
    if (m.poll) return h + 58 + m.poll.options.length * 38 + textH(m.poll.question);
    if (m.omitted || m.deleted || m.call || m.loc) return h + (m.loc ? 46 : 24);
    if (Fmt.isEmojiOnly(m.body)) return h + 44;
    return h + (textH(m.body) || M.line);
  }

  /**
   * Height of an attachment. For photos and videos the aspect ratio is only
   * known once the file has been decoded; from then on it stays in memory, so
   * when you scroll back over the same messages the estimate is exact and the
   * list does not shift.
   */
  function mediaH(entry) {
    const kind = Media.kindOf(entry.base);
    if (kind === 'audio') return 52;
    if (kind === 'sticker') return 148;
    if (kind === 'vcard' || kind === 'doc') return 56;
    const width = photoWidth();
    const ratio = st.ratios.get(entry.name) || 4 / 3;
    return Math.min(width / ratio, Math.min(innerHeight * 0.62, 460));
  }

  /* --------------------------------------------------------------- row */

  function row(i) {
    const m = st.messages[i];
    const el = document.createElement('div');
    el.className = 'row' + (i === st.flashIndex ? ' flash' : '');

    // media absorbed by an album: the row exists but takes up no space
    if (st.albumOf.has(i) && st.albumOf.get(i) !== i) return el;

    if (opensDay(i)) {
      const d = document.createElement('div');
      d.className = 'daysep';
      d.innerHTML = '<span></span>';
      d.firstChild.textContent = Fmt.dayLabel(m.t);
      el.appendChild(d);
    }

    if (m.sys) {
      const w = document.createElement('div');
      w.className = 'msg sys';
      const b = document.createElement('div');
      // in WhatsApp yellow is reserved for the encryption notice: group
      // events (people added, name, description) are neutral
      b.className = 'sysbubble' + (m.security ? ' security' : '');
      b.innerHTML = (m.security ? ICON.lock : '') + Fmt.escapeHtml(m.body);
      w.appendChild(b);
      el.appendChild(w);
      return el;
    }

    const out = isOut(m);
    const first = isFirstOfGroup(i);
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + (out ? 'out' : 'in') + (first ? ' first' : '');

    const bub = document.createElement('div');
    bub.className = 'bubble';

    if (!out && st.isGroup && first) {
      const a = document.createElement('div');
      a.className = 'author';
      a.style.color = Fmt.colorFor(m.sender);
      a.textContent = m.sender;
      bub.appendChild(a);
    }

    let onlySticker = false;
    if (st.albumFirst.has(i)) {
      bub.appendChild(albumNode(st.albumFirst.get(i)));
      bub.classList.add('with-media');
      const last = st.messages[st.albumFirst.get(i).slice(-1)[0]];
      if (last.body) {
        const cap = document.createElement('div');
        cap.className = 'text';
        cap.innerHTML = Fmt.richText(last.body, st.highlight);
        bub.appendChild(cap);
      }
    } else if (m.files) {
      for (const f of m.files) {
        const kind = Media.kindOf(f.base);
        bub.appendChild(mediaNode(m, f, kind, i));
        if (kind === 'sticker' && m.files.length === 1 && !m.body) onlySticker = true;
        // photos and videos fill the bubble, so it needs tighter padding
        if (kind === 'image' || kind === 'video') bub.classList.add('with-media');
      }
    } else if (m.deleted) {
      bub.appendChild(pill(ICON.ban, m.body || t('m.deleted')));
    } else if (m.omitted) {
      // when we know the file name we show that; otherwise WhatsApp's own
      // localized text («immagine omessa», «video omitted», …) says it all
      const kind = m.missingName ? Media.kindOf(m.missingName) : m.omittedKind;
      const label = m.missingName
        ? t('m.notInArchive', { name: Media.prettyName(m.missingName) })
        : m.body;
      const icon = m.viewOnce ? ICON.once
        : ICON[kind === 'image' ? 'image' : kind === 'video' ? 'video'
             : kind === 'audio' ? 'audio' : kind === 'sticker' ? 'sticker' : 'doc'];
      // the .txt file NEVER says which of the three cases applies: better to
      // spell them all out in a hint than to pick one at random
      bub.appendChild(pill(icon, label, m.viewOnce ? null : t('m.whyOmitted')));
    } else if (m.call) {
      bub.appendChild(pill(ICON.phone, m.body));
    } else if (m.loc) {
      bub.appendChild(locationNode(m));
    } else if (m.poll) {
      bub.appendChild(pollNode(m));
    }

    if (m.body && !m.deleted && !m.omitted && !m.call && !m.loc && !m.poll) {
      const t = document.createElement('div');
      t.className = 'text';
      if (Fmt.isEmojiOnly(m.body) && !m.files) {
        bub.classList.add('emoji-only');
        t.innerHTML = '<span class="big-emoji">' + Fmt.escapeHtml(m.body) + '</span>';
      } else {
        t.innerHTML = Fmt.richText(m.body, st.highlight);
      }
      bub.appendChild(t);
    }
    if (onlySticker) bub.classList.add('sticker-only');

    const meta = document.createElement('div');
    meta.className = 'meta';
    if (m.edited) {
      const e = document.createElement('span');
      e.className = 'edited';
      e.textContent = t('m.edited') + ' ';
      meta.appendChild(e);
    }
    const time = document.createElement('span');
    time.textContent = Fmt.time(m.t);
    meta.appendChild(time);
    if (out) meta.appendChild(icon('checks'));
    meta.title = Fmt.fullDate(m.t);
    // in voice notes the time sits next to the duration, not on a line of its own
    (bub.querySelector('.a-foot') || bub).appendChild(meta);

    wrap.appendChild(bub);
    el.appendChild(wrap);
    return el;
  }

  /**
   * Placeholder with an icon. When there is an explanation it can be opened
   * with a tap: the browser's native tooltip needs a second of hovering with
   * the mouse and on a touch screen it never shows up at all.
   */
  function pill(icon, text, hint) {
    const d = document.createElement('div');
    d.className = 'missing' + (hint ? ' has-why' : '');
    d.innerHTML = icon + '<span></span>';
    d.lastChild.textContent = text;
    if (hint) {
      d.dataset.why = hint;                    // the box itself is drawn in CSS
      // where there is no mouse (phones and tablets) a tap opens the explanation
      if (!global.matchMedia('(hover: hover)').matches) d.addEventListener('click', () => {
        const next = d.nextElementSibling;
        if (next && next.classList.contains('why')) next.remove();
        else {
          const w = document.createElement('div');
          w.className = 'why';
          w.textContent = hint;
          d.after(w);
        }
        heightChanged(d);
      });
    }
    return d;
  }

  /** Tile for photos and videos sent together, grouped the way WhatsApp does. */
  function albumNode(indexes) {
    const box = document.createElement('div');
    const n = indexes.length;
    const shown = Math.min(n, 4);
    box.className = 'album n' + (n === 2 ? 2 : n === 3 ? 3 : 4);

    for (let k = 0; k < shown; k++) {
      const msg = st.messages[indexes[k]];
      const entry = msg.files[0];
      const cell = document.createElement('div');
      cell.className = 'al-cell';
      cell.dataset.srcKey = entry.name;

      const img = document.createElement('img');
      img.decoding = 'async';
      img.alt = Media.prettyName(entry.base);
      cell.appendChild(img);
      st.store.url(entry).then(u => { img.src = u; }).catch(() => {});
      img.addEventListener('load', () => heightChanged(cell));

      if (Media.kindOf(entry.base) === 'video') {
        const play = document.createElement('div');
        play.className = 'playbadge';
        play.innerHTML = '<i>' + ICON.play + '</i>';
        cell.appendChild(play);
      }
      if (k === shown - 1 && n > shown) {
        const more = document.createElement('div');
        more.className = 'al-more';
        more.textContent = '+' + (n - shown);
        cell.appendChild(more);
      }
      cell.addEventListener('click', () => global.Lightbox && global.Lightbox.open(entry));
      box.appendChild(cell);
    }
    return box;
  }

  /** Poll card: question, options with bars and the vote total. */
  function pollNode(m) {
    const box = document.createElement('div');
    box.className = 'poll';
    const opts = m.poll.options;
    const total = opts.reduce((s, o) => s + o.votes, 0);
    const max = Math.max(1, ...opts.map(o => o.votes));

    const head = document.createElement('div');
    head.className = 'p-head';
    head.innerHTML = ICON.poll + '<span></span>';
    head.lastChild.textContent = t('m.poll');
    const q = document.createElement('div');
    q.className = 'p-q';
    q.textContent = m.poll.question;
    box.append(head, q);

    for (const o of opts) {
      const row = document.createElement('div');
      row.className = 'p-opt';
      row.innerHTML = '<div class="p-line"><span class="p-txt"></span><span class="p-n"></span></div>' +
                      '<div class="p-bar"><i></i></div>';
      row.querySelector('.p-txt').textContent = o.text;
      row.querySelector('.p-n').textContent = o.votes;
      row.querySelector('.p-bar i').style.width = (o.votes * 100 / max) + '%';
      box.appendChild(row);
    }
    const foot = document.createElement('div');
    foot.className = 'p-tot';
    foot.textContent = t('m.votes', { n: total });
    box.appendChild(foot);
    return box;
  }

  function locationNode(m) {
    const a = document.createElement('a');
    a.className = 'doc';
    a.href = m.loc.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.innerHTML = '<span class="d-ico">' + ICON.pin + '</span><span><span class="d-name">Posizione condivisa</span>' +
                  '<span class="d-sub">' + m.loc.lat + ', ' + m.loc.lng + '</span></span>';
    return a;
  }

  /* ------------------------------------------------------------- media */

  function mediaNode(m, entry, kind, i) {
    if (kind === 'audio') return audioNode(m, entry);
    if (kind === 'doc' || kind === 'vcard') return docNode(m, entry, kind);

    const box = document.createElement('div');
    const ratio = st.ratios.get(entry.name);
    box.className = 'media' +
                    (kind === 'sticker' ? ' sticker' : kind === 'image' ? ' photo' : kind === 'video' ? ' vid' : '') +
                    (m.body ? ' with-caption' : '');
    box.dataset.srcKey = entry.name;
    // reserve the space before the file has even loaded
    if (kind === 'image' || kind === 'video') box.style.aspectRatio = String(ratio || 4 / 3);

    if (kind === 'video') {
      const v = document.createElement('video');
      v.preload = 'metadata';
      v.playsInline = true;
      v.muted = true;
      box.appendChild(v);
      st.store.url(entry).then(u => { v.src = u; }).catch(() => box.appendChild(errNode(entry)));

      // WhatsApp shows the first frame with a play button on top and only opens
      // the player on tap. A bare <video> would sit there as a black rectangle
      // until the user pressed play.
      const badge = document.createElement('div');
      badge.className = 'playbadge';
      badge.innerHTML = '<i></i>';
      badge.firstChild.appendChild(icon('play'));
      const len = document.createElement('div');
      len.className = 'vidlen';
      box.append(badge, len);
      box.addEventListener('click', () => global.Lightbox && global.Lightbox.open(entry));

      // WhatsApp exports GIFs and animated stickers as .mp4 and plays them
      // itself, looping and muted: a short video has to be treated the same
      // way, otherwise it just sits there behind a play button like a movie.
      v.addEventListener('loadedmetadata', () => {
        if (v.videoWidth && v.videoHeight) {
          st.ratios.set(entry.name, v.videoWidth / v.videoHeight);
          box.style.aspectRatio = String(v.videoWidth / v.videoHeight);
        }
        const animated = /gif|sticker/i.test(entry.base) ||
                         (isFinite(v.duration) && v.duration > 0 && v.duration <= 6);
        if (animated) {
          v.loop = true;
          v.autoplay = true;
          box.classList.add('looping');
          badge.remove();
          if (/gif/i.test(entry.base)) len.textContent = 'GIF';
          v.play().catch(() => box.appendChild(badge));
        } else {
          len.textContent = Fmt.duration(v.duration);
          // Nudging the playhead makes the element paint that frame: cheapest
          // way to get a thumbnail, with no canvas and no second decode.
          try { v.currentTime = Math.min(0.1, (v.duration || 1) / 20); } catch (_) { /* ignore */ }
        }
        heightChanged(box);
      });
      return box;
    }

    const img = document.createElement('img');
    img.decoding = 'async';
    img.alt = Media.prettyName(entry.base);
    box.appendChild(img);
    st.store.url(entry).then(u => { img.src = u; }).catch(() => { box.innerHTML = ''; box.appendChild(errNode(entry)); });
    img.addEventListener('load', () => {
      if (img.naturalWidth) st.ratios.set(entry.name, img.naturalWidth / img.naturalHeight);
      heightChanged(box);
    });
    img.addEventListener('error', () => {
      box.innerHTML = '';
      box.appendChild(errNode(entry, t('m.badImage')));
      heightChanged(box);
    });
    if (kind !== 'sticker') {
      img.addEventListener('click', () => global.Lightbox && global.Lightbox.open(entry));
    }
    return box;
  }

  function errNode(entry, msg) {
    const d = document.createElement('div');
    d.className = 'ph';
    d.innerHTML = '<span></span>';
    d.firstChild.textContent = msg || t('m.cantRead');
    d.style.cursor = 'pointer';
    d.addEventListener('click', () => st.store.download(entry));
    return d;
  }

  function docNode(m, entry, kind) {
    const a = document.createElement('a');
    a.className = 'doc';
    a.href = '#';
    const name = m.docName || Media.prettyName(entry.base);
    const sub = kind === 'vcard' ? t('m.contact')
              : (m.docMeta || (Media.extOf(entry.base) + (entry.size ? ' · ' + Fmt.bytes(entry.size) : '')));
    a.innerHTML = '<span class="d-ico">' + (kind === 'vcard' ? ICON.person : ICON.doc) + '</span>' +
                  '<span style="min-width:0"><span class="d-name"></span><span class="d-sub"></span></span>' +
                  '<span class="d-dl">' + ICON.dl + '</span>';
    a.querySelector('.d-name').textContent = name;
    a.querySelector('.d-sub').textContent = sub;
    a.addEventListener('click', (e) => {
      e.preventDefault();
      if (Media.extOf(entry.base) === 'pdf') {
        st.store.url(entry).then(u => global.open(u, '_blank'));
      } else {
        st.store.download(entry);
      }
    });
    if (kind === 'vcard') {
      st.store.url(entry).then(u => fetch(u)).then(r => r.text()).then(txt => {
        const fn = /(?:^|\n)FN[^:]*:(.+)/i.exec(txt);
        const tel = /(?:^|\n)TEL[^:]*:(.+)/i.exec(txt);
        if (fn) a.querySelector('.d-name').textContent = fn[1].trim();
        if (tel) a.querySelector('.d-sub').textContent = tel[1].trim();
      }).catch(() => {});
    }
    return a;
  }

  /* ------------------------------------------------------------- audio */

  function audioNode(m, entry) {
    const wrap = document.createElement('div');
    wrap.className = 'audio';
    wrap.dataset.srcKey = entry.name;
    const voice = Media.isVoiceNote(entry.base);
    const who = m.sender || '?';

    const av = document.createElement('div');
    av.className = 'a-avatar';
    av.style.background = Fmt.colorFor(who);
    av.textContent = Fmt.initials(who);
    if (voice) {
      const mic = document.createElement('span');
      mic.className = 'mic';
      mic.innerHTML = ICON.mic;
      av.appendChild(mic);
    }

    const btn = document.createElement('button');
    btn.className = 'a-play';
    btn.type = 'button';
    btn.innerHTML = ICON.play;
    btn.setAttribute('aria-label', 'Riproduci');

    const mid = document.createElement('div');
    mid.className = 'a-mid';
    const wave = document.createElement('div');
    wave.className = 'wave';
    const bars = Media.waveform(entry.base, WAVE_BARS);
    wave.innerHTML = bars.map(v => '<i style="height:' + (v * 100).toFixed(0) + '%"></i>').join('');
    const foot = document.createElement('div');
    foot.className = 'a-foot';
    const tl = document.createElement('span');
    tl.textContent = '--:--';
    const rate = document.createElement('button');
    rate.type = 'button';
    rate.className = 'a-rate';
    rate.textContent = Media.AudioBus.rate + '×';
    foot.append(tl, rate);
    if (!voice) {
      const nm = document.createElement('span');
      nm.style.cssText = 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1';
      nm.textContent = Media.prettyName(entry.base);
      foot.appendChild(nm);
    }
    mid.append(wave, foot);
    wrap.append(av, btn, mid);

    const audio = document.createElement('audio');
    audio.preload = 'metadata';
    let loaded = false;
    const load = () => {
      if (loaded) return Promise.resolve();
      loaded = true;
      return st.store.url(entry).then(u => { audio.src = u; });
    };
    load();

    audio.addEventListener('loadedmetadata', () => { tl.textContent = Fmt.duration(audio.duration); });
    audio.addEventListener('timeupdate', () => {
      const p = audio.currentTime / (audio.duration || 1);
      tl.textContent = Fmt.duration(audio.currentTime);
      const n = Math.round(p * WAVE_BARS);
      wave.childNodes.forEach((b, k) => b.classList.toggle('on', k < n));
    });
    audio.addEventListener('ended', () => {
      btn.innerHTML = ICON.play;
      wave.childNodes.forEach(b => b.classList.remove('on'));
      tl.textContent = Fmt.duration(audio.duration);
    });
    audio.addEventListener('pause', () => { btn.innerHTML = ICON.play; });
    audio.addEventListener('play', () => { btn.innerHTML = ICON.pause; });
    audio.addEventListener('error', () => {
      mid.innerHTML = '';
      const e = document.createElement('div');
      e.className = 'a-err';
      e.textContent = t('m.audioFail');
      e.style.cursor = 'pointer';
      e.addEventListener('click', () => st.store.download(entry));
      mid.appendChild(e);
      heightChanged(wrap);
    });

    btn.addEventListener('click', () => {
      if (audio.paused) load().then(() => Media.AudioBus.play(audio).catch(() => {}));
      else audio.pause();
    });
    wave.addEventListener('click', (e) => {
      const r = wave.getBoundingClientRect();
      if (audio.duration) audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
    });
    rate.addEventListener('click', () => {
      const next = { 1: 1.5, 1.5: 2, 2: 1 }[Media.AudioBus.rate] || 1;
      Media.AudioBus.setRate(next);
      document.querySelectorAll('.a-rate').forEach(b => { b.textContent = next + '×'; });
    });

    wrap.appendChild(audio);
    return wrap;
  }

  global.Renderer = { init, row, estimate, measureColumn, state: st, ICON };
})(window);
</script>
<script>
/* ==========================================================================
   panels.js — search, statistics, settings and the full-screen viewer.
   ========================================================================== */
(function (global) {
  'use strict';

  const { Fmt, Media } = global;
  const t = (k, v) => global.I18n.t(k, v);
  const $ = (id) => document.getElementById(id);

  /* ======================================================= generic panel */

  const Panel = {
    open(title, node) {
      $('panelTitle').textContent = title;
      const body = $('panelBody');
      body.innerHTML = '';
      body.appendChild(node);
      body.scrollTop = 0;
      $('panel').hidden = false;
      $('scrim').hidden = false;
    },
    close() {
      $('panel').hidden = true;
      $('scrim').hidden = true;
    },
    get isOpen() { return !$('panel').hidden; },
  };

  const el = (tag, cls, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  };

  /* ============================================================== search */

  const Search = {
    hits: [], pos: -1, term: '',

    run(term, app) {
      this.term = term.trim();
      const q = this.term.toLowerCase();
      this.hits = [];
      if (q.length >= 2) {
        const msgs = app.messages;
        for (let i = 0; i < msgs.length; i++) {
          const m = msgs[i];
          if (m.body && m.body.toLowerCase().includes(q)) this.hits.push(i);
          else if (m.sender && m.files && m.sender.toLowerCase().includes(q)) this.hits.push(i);
        }
      }
      this.pos = this.hits.length ? this.hits.length - 1 : -1;
      global.Renderer.state.highlight = q.length >= 2 ? this.term : '';
      app.redraw();
      this.updateCount();
      return this.hits;
    },

    updateCount() {
      $('searchCount').textContent = !this.term ? ''
        : this.hits.length ? (this.pos + 1) + '/' + this.hits.length
        : t('s.none');
    },

    step(delta, app) {
      if (!this.hits.length) return;
      this.pos = (this.pos + delta + this.hits.length) % this.hits.length;
      app.jumpTo(this.hits[this.pos]);
      this.updateCount();
    },

    /** List of hits, each with a preview snippet, shown in the side panel. */
    panel(app) {
      const box = el('div', 'results');
      if (!this.hits.length) {
        box.appendChild(el('div', 'empty', this.term
          ? Fmt.escapeHtml(t('s.nomatch', { q: this.term }))
          : t('s.short')));
        return box;
      }
      const max = Math.min(this.hits.length, 400);
      for (let k = 0; k < max; k++) {
        const i = this.hits[k];
        const m = app.messages[i];
        const b = el('button', 'result');
        b.type = 'button';
        b.innerHTML =
          '<span class="r-top"><span class="r-who"></span><span class="r-when"></span></span>' +
          '<span class="r-txt"></span>';
        b.querySelector('.r-who').textContent = m.sender || '';
        b.querySelector('.r-when').textContent = Fmt.shortDate(m.t) + ' ' + Fmt.time(m.t);
        b.querySelector('.r-txt').innerHTML = Fmt.richText(snippet(m.body, this.term), this.term)
          .replace(/<a [^>]*>|<\/a>/g, '');
        b.addEventListener('click', () => {
          this.pos = k;
          this.updateCount();
          app.jumpTo(i);
          if (global.matchMedia('(max-width:640px)').matches) Panel.close();
        });
        box.appendChild(b);
      }
      if (this.hits.length > max) {
        box.appendChild(el('div', 'empty', t('s.firstN', { n: max, tot: this.hits.length })));
      }
      return box;
    },
  };

  function snippet(text, term) {
    if (!text) return '';
    const i = text.toLowerCase().indexOf(term.toLowerCase());
    if (i < 60) return text.slice(0, 180);
    return '…' + text.slice(i - 40, i + 140);
  }

  /* ========================================================== statistics */

  function statsPanel(app) {
    const msgs = app.messages;
    const box = el('div');

    const perSender = new Map();
    const perDay = new Map();
    const kinds = { image: 0, video: 0, audio: 0, sticker: 0, doc: 0, vcard: 0 };
    const emoji = new Map();
    const RE_EMO = /\p{Extended_Pictographic}/gu;
    let words = 0, chars = 0, media = 0, sysN = 0;

    for (const m of msgs) {
      if (m.sys) { sysN++; continue; }
      perSender.set(m.sender, (perSender.get(m.sender) || 0) + 1);
      const dk = Fmt.dayKey(m.t);
      perDay.set(dk, (perDay.get(dk) || 0) + 1);
      if (m.files) { media += m.files.length; for (const f of m.files) kinds[Media.kindOf(f.base)]++; }
      if (m.body) {
        chars += m.body.length;
        words += m.body.split(/\s+/).filter(Boolean).length;
        const em = m.body.match(RE_EMO);
        if (em) for (const e of em) emoji.set(e, (emoji.get(e) || 0) + 1);
      }
    }

    const days = perDay.size || 1;
    const busiest = [...perDay.entries()].sort((a, b) => b[1] - a[1])[0];
    const first = msgs[0], last = msgs[msgs.length - 1];

    const grid = el('div', 'stat-grid');
    const stat = (n, k) => {
      const s = el('div', 'stat', '<div class="n"></div><div class="k"></div>');
      s.querySelector('.n').textContent = n;
      s.querySelector('.k').textContent = k;
      return s;
    };
    grid.append(
      stat((msgs.length - sysN).toLocaleString(Fmt.LOCALE), t('st.messages')),
      stat(media.toLocaleString(Fmt.LOCALE), t('st.media')),
      stat(days.toLocaleString(Fmt.LOCALE), t('st.days')),
      stat(Math.round((msgs.length - sysN) / days).toLocaleString(Fmt.LOCALE), t('st.perDay')),
      stat(words.toLocaleString(Fmt.LOCALE), t('st.words')),
      stat(Math.round(chars / Math.max(1, msgs.length - sysN - media)), t('st.charsPerMsg')),
    );
    box.appendChild(grid);

    box.appendChild(el('div', 'field-title', t('st.perPerson')));
    const top = [...perSender.entries()].sort((a, b) => b[1] - a[1]);
    const maxN = top.length ? top[0][1] : 1;
    for (const [name, n] of top) {
      const r = el('div', 'bar-row', '<div class="bl"><span></span><span></span></div><div class="bar"><i></i></div>');
      r.querySelectorAll('.bl span')[0].textContent = name;
      r.querySelectorAll('.bl span')[1].textContent = n.toLocaleString(Fmt.LOCALE) +
        '  ·  ' + Math.round(n * 100 / Math.max(1, msgs.length - sysN)) + '%';
      const bar = r.querySelector('.bar i');
      bar.style.width = (n * 100 / maxN) + '%';
      bar.style.background = Fmt.colorFor(name);
      box.appendChild(r);
    }

    const kindLabels = { image: t('k.image'), video: t('k.video'), audio: t('k.audio'),
                         sticker: t('k.sticker'), doc: t('k.doc'), vcard: t('k.vcard') };
    const present = Object.entries(kinds).filter(([, n]) => n > 0);
    if (present.length) {
      box.appendChild(el('div', 'field-title', t('st.kinds')));
      const kmax = Math.max(...present.map(([, n]) => n));
      for (const [k, n] of present.sort((a, b) => b[1] - a[1])) {
        const r = el('div', 'bar-row', '<div class="bl"><span></span><span></span></div><div class="bar"><i></i></div>');
        r.querySelectorAll('.bl span')[0].textContent = kindLabels[k];
        r.querySelectorAll('.bl span')[1].textContent = n;
        r.querySelector('.bar i').style.width = (n * 100 / kmax) + '%';
        box.appendChild(r);
      }
    }

    const topEmoji = [...emoji.entries()].sort((a, b) => b[1] - a[1]).slice(0, 10);
    if (topEmoji.length) {
      box.appendChild(el('div', 'field-title', t('st.emoji')));
      const line = el('div', 'chips');
      for (const [e, n] of topEmoji) line.appendChild(el('span', 'chip', Fmt.escapeHtml(e) + ' ' + n));
      box.appendChild(line);
    }

    box.appendChild(el('div', 'field-title', t('st.period')));
    const info = el('div');
    info.style.cssText = 'font-size:13.6px;color:var(--text-muted);line-height:1.8';
    info.innerHTML =
      t('st.first') + ': <b>' + Fmt.fullDate(first.t) + '</b><br>' +
      t('st.last') + ': <b>' + Fmt.fullDate(last.t) + '</b><br>' +
      (busiest ? t('st.busiest') + ': <b>' + Fmt.dayLabel(dayFromKey(busiest[0])) + '</b> (' +
                 t('st.msgs', { n: busiest[1] }) + ')' : '');
    box.appendChild(info);

    return box;
  }

  const dayFromKey = (k) => new Date(Math.floor(k / 10000), Math.floor(k / 100) % 100, k % 100).getTime();

  /* ============================================================ settings */

  function settingsPanel(app) {
    const box = el('div');

    /* --- who you are --- */
    const f1 = el('div', 'field');
    f1.appendChild(el('label', null, t('set.you')));
    const chips = el('div', 'chips');
    for (const p of app.participants) {
      const c = el('button', 'chip' + (p.name === app.me ? ' on' : ''));
      c.type = 'button';
      c.textContent = p.name;
      c.addEventListener('click', () => {
        app.setMe(p.name);
        chips.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x.textContent === p.name));
      });
      chips.appendChild(c);
    }
    f1.appendChild(chips);
    f1.appendChild(el('div', 'hint', t('set.youHint')));
    box.appendChild(f1);

    /* --- theme --- */
    const f2 = el('div', 'field');
    f2.appendChild(el('label', null, t('set.look')));
    const themes = [['auto', t('set.auto')], ['light', t('set.light')], ['dark', t('set.dark')]];
    const tc = el('div', 'chips');
    for (const [v, label] of themes) {
      const c = el('button', 'chip' + (app.theme === v ? ' on' : ''));
      c.type = 'button';
      c.textContent = label;
      c.addEventListener('click', () => {
        app.setTheme(v);
        tc.querySelectorAll('.chip').forEach((x, k) => x.classList.toggle('on', themes[k][0] === v));
      });
      tc.appendChild(c);
    }
    f2.appendChild(tc);
    box.appendChild(f2);

    /* --- interface language --- */
    const fl = el('div', 'field');
    fl.appendChild(el('label', null, t('set.lang')));
    const lsel = el('select');
    for (const { code, name } of global.I18n.list) {
      const o = document.createElement('option');
      o.value = code; o.textContent = name;
      o.selected = code === global.I18n.lang;
      lsel.appendChild(o);
    }
    lsel.addEventListener('change', () => {
      global.I18n.setLang(lsel.value);
      Panel.open(t('pan.settings'), settingsPanel(app));
    });
    fl.appendChild(lsel);
    box.appendChild(fl);

    /* --- jump to date --- */
    const f3 = el('div', 'field');
    f3.appendChild(el('label', null, t('set.goto')));
    const dr = el('div', 'row-opt');
    const input = el('input');
    input.type = 'date';
    const lo = new Date(app.messages[0].t), hi = new Date(app.messages[app.messages.length - 1].t);
    const iso = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    input.min = iso(lo); input.max = iso(hi); input.value = iso(hi);
    const go = el('button', 'chip', t('set.go'));
    go.type = 'button';
    go.addEventListener('click', () => {
      const [y, m, d] = input.value.split('-').map(Number);
      const key = y * 10000 + (m - 1) * 100 + d;
      let idx = app.messages.findIndex(x => Fmt.dayKey(x.t) >= key);
      if (idx < 0) idx = app.messages.length - 1;
      app.jumpTo(idx, 'start');
      if (global.matchMedia('(max-width:640px)').matches) Panel.close();
    });
    dr.append(input, go);
    f3.appendChild(dr);
    box.appendChild(f3);

    /* --- date order --- */
    const f4 = el('div', 'field');
    f4.appendChild(el('label', null, t('set.order')));
    const sel = el('select');
    for (const [v, label] of [['auto', t('set.orderAuto')], ['dmy', t('set.dmy')], ['mdy', t('set.mdy')], ['ymd', t('set.ymd')]]) {
      const o = document.createElement('option');
      o.value = v; o.textContent = label;
      o.selected = (app.dateOrderPref || 'auto') === v;
      sel.appendChild(o);
    }
    sel.addEventListener('change', () => app.reparse(sel.value));
    f4.appendChild(sel);
    f4.appendChild(el('div', 'hint', t('set.orderHint', {
      v: ({ dmy: t('set.dmy'), mdy: t('set.mdy'), ymd: t('set.ymd') })[app.dateOrder],
    })));
    box.appendChild(f4);

    /* --- archive summary --- */
    const f5 = el('div', 'field');
    f5.appendChild(el('label', null, t('set.archive')));
    const sum = el('div');
    sum.style.cssText = 'font-size:13.4px;color:var(--text-muted);line-height:1.7';
    sum.innerHTML = Fmt.escapeHtml(app.archiveName) + '<br>' + t('set.files', {
      n: app.messages.length.toLocaleString(Fmt.LOCALE),
      f: Math.max(0, app.archive.entries.length - 1).toLocaleString(Fmt.LOCALE),
    });
    f5.appendChild(sum);
    const close = el('button', 'chip', t('set.closeChat'));
    close.type = 'button';
    close.style.marginTop = '12px';
    close.addEventListener('click', () => { Panel.close(); app.reset(); });
    f5.appendChild(close);
    box.appendChild(f5);

    return box;
  }

  /* ============================================================ lightbox */

  const Lightbox = {
    items: [], idx: -1,

    setGallery(items) { this.items = items; },

    open(entry) {
      this.idx = this.items.findIndex(e => e.name === entry.name);
      if (this.idx < 0) { this.items = [entry]; this.idx = 0; }
      $('lightbox').hidden = false;
      this.show();
    },

    show() {
      const entry = this.items[this.idx];
      const stage = $('lbStage');
      stage.innerHTML = '';
      $('lbTitle').textContent = Media.prettyName(entry.base) +
        (this.items.length > 1 ? '  ·  ' + (this.idx + 1) + ' di ' + this.items.length : '');
      const kind = Media.kindOf(entry.base);
      const node = document.createElement(kind === 'video' ? 'video' : 'img');
      if (kind === 'video') { node.controls = true; node.autoplay = true; node.playsInline = true; }
      stage.appendChild(node);
      global.App.store.url(entry).then(u => {
        node.src = u;
        $('lbDownload').href = u;
        $('lbDownload').download = Media.prettyName(entry.base);
      });
      const many = this.items.length > 1;
      $('lbPrev').hidden = !many;
      $('lbNext').hidden = !many;
    },

    step(d) {
      if (this.items.length < 2) return;
      this.idx = (this.idx + d + this.items.length) % this.items.length;
      this.show();
    },

    close() {
      $('lightbox').hidden = true;
      $('lbStage').innerHTML = '';
    },

    get isOpen() { return !$('lightbox').hidden; },
  };

  global.Panels = { Panel, Search, statsPanel, settingsPanel };
  global.Lightbox = Lightbox;
})(window);
</script>
<script>
/* ==========================================================================
   app.js — wiring between archive, parser, virtual list and interface.
   ========================================================================== */
(function (global) {
  'use strict';

  const { Archive, Parser, Fmt, Media, Virtual, Renderer, Panels, Lightbox } = global;
  const { Panel, Search } = Panels;
  const t = (k, v) => global.I18n.t(k, v);
  const $ = (id) => document.getElementById(id);

  const LS_THEME = 'wa-viewer:theme';
  const LS_ME = 'wa-viewer:me:';

  /* Storage is not always reachable (sandboxed frames, blocked site data, some
     file:// setups). Losing the saved preferences is fine; crashing is not. */
  const store = {
    get(k) { try { return global.localStorage.getItem(k); } catch (_) { return null; } },
    set(k, v) { try { global.localStorage.setItem(k, v); } catch (_) { /* not stored */ } },
  };

  const App = {
    archive: null, archiveName: '', store: null, list: null,
    messages: [], participants: [], me: null, isGroup: false,
    chatName: '', dateOrder: 'dmy', dateOrderPref: 'auto', rawText: '', fileMap: null,
    theme: store.get(LS_THEME) || 'auto',

    /* ----------------------------------------------------------- loading */

    async load(source) {
      showProgress(0, t('p.open'));
      $('loadError').hidden = true;
      try {
        let archive;
        if (source instanceof File && Archive.ZipArchive.isZip(source)) {
          archive = await new Archive.ZipArchive(source).open();
        } else if (source instanceof File) {
          archive = new Archive.FolderArchive([source]);
        } else {
          archive = new Archive.FolderArchive(source);
        }

        const chatEntry = pickChatFile(archive.entries);
        if (!chatEntry) {
          throw new Error(t('e.nochat'));
        }

        showProgress(0.25, t('p.read'));
        this.archive = archive;
        this.archiveName = archive.name;
        this.rawText = await archive.text(chatEntry);

        this.fileMap = new Map();
        for (const e of archive.entries) {
          if (e === chatEntry) continue;
          this.fileMap.set(e.base.toLowerCase(), e);
          this.fileMap.set(e.name.toLowerCase(), e);
        }

        await this.parseAndShow('auto');
      } catch (err) {
        console.error(err);
        $('loadProgress').hidden = true;
        $('loadError').hidden = false;
        $('loadError').textContent = err && err.message ? err.message : String(err);
      }
    },

    async parseAndShow(orderPref) {
      showProgress(0.35, t('p.parse'));
      const res = await Parser.parse(this.rawText, this.fileMap, {
        order: orderPref,
        onProgress: (p) => showProgress(0.35 + p * 0.55, t('p.parse')),
      });
      if (!res.messages.length) {
        throw new Error(t('e.empty'));
      }

      this.dateOrderPref = orderPref;
      this.dateOrder = res.order;
      this.messages = res.messages;
      this.participants = res.participants;
      this.isGroup = res.participants.length > 2;
      this.chatName = guessChatName(this.archiveName, res.participants, this.isGroup);
      this.me = this.pickMe();

      showProgress(0.95, t('p.prepare'));
      this.store = new Media.MediaStore(this.archive, 140);
      this.ratios = await scanImageSizes(this.archive, this.messages);
      Lightbox.setGallery(collectGallery(this.messages));
      this.mount();
      $('loadProgress').hidden = true;
    },

    /** Who you are: the saved choice, otherwise "not the person in the title". */
    pickMe() {
      const saved = store.get(LS_ME + this.chatName);
      if (saved && this.participants.some(p => p.name === saved)) return saved;
      // some exports sign your own messages with the localised word for "you"
      const you = this.participants.find(p => global.Markers.isYou(p.name));
      if (you) return you.name;
      if (this.participants.length === 2) {
        const other = this.participants.find(p => this.chatName.includes(p.name));
        if (other) {
          const me = this.participants.find(p => p.name !== other.name);
          if (me) return me.name;
        }
      }
      return null;
    },

    setMe(name) {
      this.me = name;
      store.set(LS_ME + this.chatName, name);
      this.updateHeader();
      this.redraw();
    },

    setTheme(v) {
      this.theme = v;
      store.set(LS_THEME, v);
      applyTheme(v);
    },

    async reparse(orderPref) {
      if (this.list) { this.list.destroy(); this.list = null; }
      if (this.store) this.store.dispose();
      Panel.close();
      $('app').hidden = true;
      $('welcome').hidden = false;
      await this.parseAndShow(orderPref);
    },

    /* -------------------------------------------------------------- view */

    mount() {
      $('welcome').hidden = true;
      $('app').hidden = false;
      this.updateHeader();

      Fmt.setMentions(this.participants.map(p => p.name));
      Renderer.init({
        ratios: this.ratios || new Map(),
        messages: this.messages,
        me: this.me,
        isGroup: this.isGroup,
        store: this.store,
        highlight: '',
        flashIndex: -1,
      });

      const chat = $('chat'), inner = $('list');
      inner.innerHTML = '';
      this.list = new Virtual.VirtualList({
        scroller: chat,
        inner,
        count: this.messages.length,
        estimate: Renderer.estimate,
        render: Renderer.row,
      });
      Renderer.state.list = this.list;
      this.list.scrollToBottom();
      requestAnimationFrame(() => this.list.scrollToBottom());

      chat.addEventListener('scroll', () => {
        const far = chat.scrollHeight - chat.scrollTop - chat.clientHeight > 600;
        $('btnDown').hidden = !far;
        this.updateDateChip();
      }, { passive: true });
      this.updateDateChip();
    },

    /** Date of the first visible message, shown at the top while scrolling. */
    updateDateChip() {
      const chip = $('dateChip');
      if (!this.list || !this.messages.length) { chip.classList.remove('on'); return; }
      const chat = $('chat');
      const i = this.list.fen.search(chat.scrollTop + 4);
      const msg = this.messages[Math.max(0, Math.min(this.messages.length - 1, i))];
      const label = Fmt.dayLabel(msg.t);
      if (label !== this._chipLabel) {
        chip.firstChild.textContent = label;
        this._chipLabel = label;
      }
      // at the top the real separator is already there: the chip would only repeat it
      chip.classList.toggle('on', chat.scrollTop > 30);
    },

    updateHeader() {
      $('chatName').textContent = this.chatName;
      const av = $('chatAvatar');
      av.textContent = Fmt.initials(this.chatName);
      av.style.background = Fmt.colorFor(this.chatName);
      // count matches the statistics: system notices are not messages
      const n = this.messages.reduce((k, m) => k + (m.sys ? 0 : 1), 0).toLocaleString(Fmt.LOCALE);
      $('chatSub').textContent = this.me
        ? (this.isGroup ? t('h.participants', { n: this.participants.length }) + ' · ' : '') +
          t('h.messages', { n })
        : t('h.whoareyou');
    },

    /** Redraws everything, keeping the reading position. */
    redraw() {
      if (!this.list) return;
      Renderer.state.me = this.me;
      Renderer.measureColumn();
      const anchor = this.list.fen.search(this.list.scroller.scrollTop);
      this.list.clear();
      this.list.resetHeights();
      this.list.update();
      this.list.scrollToIndex(anchor, 'start');
    },

    jumpTo(i, align) {
      Renderer.state.flashIndex = i;
      setTimeout(() => this.updateDateChip(), 60);
      this.list.invalidate(i);
      this.list.scrollToIndex(i, align || 'center');
      clearTimeout(this._flash);
      this._flash = setTimeout(() => {
        Renderer.state.flashIndex = -1;
        this.list && this.list.invalidate(i);
      }, 2000);
    },

    /** Re-renders everything that carries a translated label. */
    relabel() {
      if (!this.messages.length) return;
      this.updateHeader();
      if (Panel.isOpen) Panel.close();
      this.redraw();
    },

    reset() {
      if (this.list) { this.list.destroy(); this.list = null; }
      if (this.store) { this.store.dispose(); this.store = null; }
      Lightbox.close();
      this.messages = [];
      this.archive = null;
      $('app').hidden = true;
      $('welcome').hidden = false;
      $('loadProgress').hidden = true;
      $('searchbar').hidden = true;
      $('fileInput').value = '';
    },
  };

  /* ------------------------------------------------------------- helpers */

  function pickChatFile(entries) {
    const txt = entries.filter(e => /\.txt$/i.test(e.base));
    if (!txt.length) return null;
    return txt.find(e => /^_chat\.txt$/i.test(e.base))
        || txt.find(e => /chat/i.test(e.base))
        || txt.sort((a, b) => b.size - a.size)[0];
  }

  /** Works out the chat name from the name of the archive WhatsApp exported. */
  function guessChatName(archiveName, participants, isGroup) {
    let n = String(archiveName || '').replace(/\.zip$/i, '');
    n = n.replace(/^whatsapp\s*chat(\s*[-–—]\s*|\s+(con|with|mit|avec|com)\s+)/i, '')
         .replace(/^chat\s*(whatsapp)?\s*(con|with)?\s*[-–—]?\s*/i, '')
         .trim();
    if (n && n.toLowerCase() !== 'chat' && n.length < 80) return n;
    if (isGroup) return 'Gruppo';
    return participants.map(p => p.name).slice(0, 2).join(' e ') || 'Conversazione';
  }

  /**
   * Reads photo aspect ratios straight from the file headers, before the chat
   * is shown. It costs a few milliseconds (media inside WhatsApp archives is
   * not compressed) and lets us reserve the right amount of room up front:
   * without it a bubble has no height until its photo loads, and if you
   * scroll fast you see nothing but the background.
   */
  async function scanImageSizes(archive, messages) {
    const ratios = new Map();
    const seen = new Set();
    const entries = [];
    for (const m of messages) {
      if (!m.files) continue;
      for (const f of m.files) {
        if (seen.has(f.name)) continue;
        seen.add(f.name);
        if (Media.kindOf(f.base) === 'image') entries.push(f);
      }
    }
    if (!entries.length) return ratios;

    const t0 = performance.now();
    let next = 0;
    const worker = async () => {
      while (next < entries.length && performance.now() - t0 < 2500) {
        const e = entries[next++];
        try {
          const head = await archive.head(e, 65536);
          const size = head && Media.imageSize(head);
          if (size && size.w > 0 && size.h > 0) ratios.set(e.name, size.w / size.h);
        } catch (_) { /* one unreadable photo must not stop the load */ }
      }
    };
    await Promise.all(Array.from({ length: 8 }, worker));
    return ratios;
  }

  function collectGallery(messages) {
    const out = [];
    for (const m of messages) {
      if (!m.files) continue;
      for (const f of m.files) {
        const k = Media.kindOf(f.base);
        if (k === 'image' || k === 'video') out.push(f);
      }
    }
    return out;
  }

  function showProgress(p, label) {
    const box = $('loadProgress');
    box.hidden = false;
    box.querySelector('.progress-bar i').style.width = Math.round(p * 100) + '%';
    box.querySelector('.progress-label').textContent = label;
  }

  function applyTheme(v) {
    const root = document.documentElement;
    if (v === 'auto') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', v);
    const dark = v === 'dark' || (v === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = dark ? '#202c33' : '#f0f2f5';
  }

  /* ------------------------------------------------------------------ UI */

  function wire() {
    global.I18n.init();
    applyTheme(App.theme);

    const ls = $('langSelect');
    for (const { code, name } of global.I18n.list) {
      const o = document.createElement('option');
      o.value = code; o.textContent = name;
      o.selected = code === global.I18n.lang;
      ls.appendChild(o);
    }
    ls.addEventListener('change', () => global.I18n.setLang(ls.value));

    const dz = $('dropzone');
    dz.addEventListener('click', () => $('fileInput').click());
    dz.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('fileInput').click(); }
    });
    $('pickFolder').addEventListener('click', () => $('folderInput').click());
    $('pickTxt').addEventListener('click', () => $('txtInput').click());

    $('fileInput').addEventListener('change', (e) => e.target.files[0] && App.load(e.target.files[0]));
    $('txtInput').addEventListener('change', (e) => e.target.files[0] && App.load(e.target.files[0]));
    $('folderInput').addEventListener('change', (e) => e.target.files.length && App.load(e.target.files));

    ['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, (e) => {
      e.preventDefault();
      if ($('welcome').hidden) return;
      dz.classList.add('over');
    }));
    ['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, (e) => {
      e.preventDefault();
      dz.classList.remove('over');
    }));
    document.addEventListener('drop', (e) => {
      const f = e.dataTransfer && e.dataTransfer.files[0];
      if (f && $('welcome').hidden === false) App.load(f);
    });

    $('btnHome').addEventListener('click', () => App.reset());
    $('btnDown').addEventListener('click', () => App.list.scrollToBottom());

    $('btnStats').addEventListener('click', () => Panel.open(t('pan.stats'), Panels.statsPanel(App)));
    $('btnSettings').addEventListener('click', () => Panel.open(t('pan.settings'), Panels.settingsPanel(App)));
    $('panelClose').addEventListener('click', () => Panel.close());
    $('scrim').addEventListener('click', () => Panel.close());

    /* --- search --- */
    const si = $('searchInput');
    $('btnSearch').addEventListener('click', () => {
      const bar = $('searchbar');
      bar.hidden = !bar.hidden;
      if (!bar.hidden) si.focus();
      else closeSearch();
    });
    $('searchClose').addEventListener('click', closeSearch);
    let deb;
    si.addEventListener('input', () => {
      clearTimeout(deb);
      deb = setTimeout(() => {
        Search.run(si.value, App);
        if (Search.hits.length) App.jumpTo(Search.hits[Search.pos]);
        if (si.value.trim().length >= 2 && !matchMedia('(max-width:640px)').matches) {
          Panel.open(t('pan.results'), Search.panel(App));
        }
      }, 220);
    });
    si.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); Search.step(e.shiftKey ? -1 : 1, App); }
    });
    $('searchPrev').addEventListener('click', () => Search.step(-1, App));
    $('searchNext').addEventListener('click', () => Search.step(1, App));

    function closeSearch() {
      $('searchbar').hidden = true;
      si.value = '';
      Search.hits = [];
      Search.term = '';
      Renderer.state.highlight = '';
      $('searchCount').textContent = '';
      if (Panel.isOpen && $('panelTitle').textContent === t('pan.results')) Panel.close();
      App.redraw();
    }

    /* --- shared tooltip for the "not attached" placeholders --- */
    const tip = $('tip');
    let tipFor = null;
    // Touching the DOM on every scroll event would invalidate styles each
    // frame: only act when the tooltip is actually up.
    const hideTip = () => {
      if (!tipFor) return;
      tip.classList.remove('on');
      tip.hidden = true;
      tipFor = null;
    };
    const showTip = (el) => {
      tip.textContent = el.dataset.why || '';
      tip.hidden = false;
      tip.style.left = '0px';
      tip.style.top = '0px';
      const r = el.getBoundingClientRect();
      const box = $('app').getBoundingClientRect();
      const w = tip.offsetWidth, h = tip.offsetHeight;
      const left = Math.max(8, Math.min(r.left - box.left, box.width - w - 8));
      tip.style.left = left + 'px';
      tip.style.top = (r.top - box.top - h - 9) + 'px';
      // the arrow follows the element, even when the box had to be nudged
      tip.style.setProperty('--tip-arrow',
        Math.max(10, Math.min(w - 16, r.left - box.left - left + 12)) + 'px');
      tip.classList.add('on');
      tipFor = el;
    };
    const chatEl = $('chat');
    chatEl.addEventListener('mouseover', (e) => {
      const el = e.target.closest && e.target.closest('.missing.has-why');
      if (el && el !== tipFor) showTip(el);
    });
    chatEl.addEventListener('mouseout', (e) => {
      if (e.target.closest && e.target.closest('.missing.has-why')) hideTip();
    });
    chatEl.addEventListener('scroll', hideTip, { passive: true });

    /* --- lightbox --- */
    $('lbClose').addEventListener('click', () => Lightbox.close());
    $('lbPrev').addEventListener('click', () => Lightbox.step(-1));
    $('lbNext').addEventListener('click', () => Lightbox.step(1));
    $('lightbox').addEventListener('click', (e) => { if (e.target.id === 'lightbox' || e.target.id === 'lbStage') Lightbox.close(); });

    document.addEventListener('keydown', (e) => {
      if (Lightbox.isOpen) {
        if (e.key === 'Escape') Lightbox.close();
        if (e.key === 'ArrowLeft') Lightbox.step(-1);
        if (e.key === 'ArrowRight') Lightbox.step(1);
        return;
      }
      if (e.key === 'Escape') {
        if (Panel.isOpen) Panel.close();
        else if (!$('searchbar').hidden) closeSearch();
        return;
      }
      if (e.key === '/' && document.activeElement === document.body && !$('app').hidden) {
        e.preventDefault();
        $('searchbar').hidden = false;
        si.focus();
      }
    });

    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme(App.theme));
  }

  global.App = App;
  /* Only wire up when there is a page to wire: the file is also loaded bare in
     the module smoke test, where no document exists. */
  if (global.document) global.document.addEventListener('DOMContentLoaded', wire);
})(window);
</script>
</body>
</html>
